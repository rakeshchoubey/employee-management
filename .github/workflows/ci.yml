
name: Employee Management CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-build:
    name: Java Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test Spring Boot
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Upload Java JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React application
        working-directory: frontend
        run: npm run build

      - name: Upload React build artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7
